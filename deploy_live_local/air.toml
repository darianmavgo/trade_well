# air config for deploy_live_local/servelocal.sh. Not the repo-root .air.toml:
# that one builds `./...` and runs the binary from the repo root, where the app
# would read .env. Here the build is build.sh (the GAE build) and the process is .run_app.sh, which servelocal.sh generates: it runs
# the binary from an empty directory with a scrubbed environment.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "./deploy_live_local/build.sh"
  entrypoint = ["./deploy_live_local/.run_app.sh"]
  include_ext = ["go", "html", "js", "css", "sql"]
  exclude_dir = ["bin", "tmp", "data", ".git", ".deploy_cache", "node_modules"]
  delay = 500
  # SIGINT lets the app shut down cleanly (it finishes the request in flight).
  send_interrupt = true
  kill_delay = "3s"
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = false
